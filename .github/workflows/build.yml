name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.jks -alias blob \
            -keyalg RSA -keysize 2048 -validity 7300 \
            -storepass blob-tmp-2026 -keypass blob-tmp-2026 \
            -dname "CN=Blob, O=Blob, C=IR"

      - name: Fetch Xray core library
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar"
          ls -la app/libs || dir app/libs || true

      - name: Use the NDK and CMake already on the runner
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK=$(ls "$SDK/ndk" 2>/dev/null | sort -V | tail -1 || true)
          CMT=$(ls "$SDK/cmake" 2>/dev/null | sort -V | tail -1 || true)
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "cmake=$CMT" >> "$GITHUB_OUTPUT"
          echo "sdk root : $SDK"
          echo "ndk      : ${NDK:-none installed}"
          echo "cmake    : ${CMT:-none installed}"
          ls "$SDK" 2>/dev/null || true

      - name: Build release APK
        env:
          CI_NDK: ${{ steps.sdk.outputs.ndk }}
          CI_CMAKE: ${{ steps.sdk.outputs.cmake }}
        run: |
          ARGS=""
          if [ -n "$CI_NDK" ]; then ARGS="$ARGS -PciNdkVersion=$CI_NDK"; fi
          if [ -n "$CI_CMAKE" ]; then ARGS="$ARGS -PciCmakeVersion=$CI_CMAKE"; fi
          echo "gradle args:$ARGS"
          gradle :app:assembleRelease --no-daemon --stacktrace $ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-Compose-apk
          path: app/build/outputs/apk/release/*.apk
