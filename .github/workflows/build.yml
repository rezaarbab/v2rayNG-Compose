name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.jks -alias blob \
            -keyalg RSA -keysize 2048 -validity 7300 \
            -storepass blob-tmp-2026 -keypass blob-tmp-2026 \
            -dname "CN=Blob, O=Blob, C=IR"

      - name: Fetch Xray core library
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar"
          ls -la app/libs || dir app/libs || true

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-Compose-apk
          path: app/build/outputs/apk/release/*.apk
