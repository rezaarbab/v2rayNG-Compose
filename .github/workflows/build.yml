name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore or create the signing keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf %s "$KS_B64" | base64 -d > ci-release.jks
            echo "keystore restored from the repository secret - same certificate as the last build"
          else
            keytool -genkeypair -v -keystore ci-release.jks -alias blob -keyalg RSA -keysize 2048 -validity 7300 -storepass blob-tmp-2026 -keypass blob-tmp-2026 -dname "CN=Blob, O=Blob, C=IR"
            echo "::warning::RELEASE_KEYSTORE_B64 is not set, so this APK is signed with a throwaway certificate. Installing over the previous one forces an uninstall, and Android then deletes the keystore key plus all app data: settings, server list and traffic look wiped on every build."
          fi

      - name: Fetch Xray core library
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar"
          ls -la app/libs || dir app/libs || true

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-Compose-apk
          path: app/build/outputs/apk/release/*.apk
